# Nginx Production Configuration for Radhna Cuisine Backend & WebSockets

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Map HTTP upgrade header for WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name api.yourdomain.com;

        # Redirect HTTP to HTTPS (handled by Certbot / Let's Encrypt)
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://backend-api:3000;
            proxy_http_version 1.1;

            # Required for WebSocket / Socket.io live kitchen alerts
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for persistent WebSocket connection
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
