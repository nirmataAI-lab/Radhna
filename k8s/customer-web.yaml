apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-web
  namespace: radhna-cuisine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-web
  template:
    metadata:
      labels:
        app: customer-web
    spec:
      containers:
        - name: nextjs
          image: radhna/customer-web:latest
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: radhna-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customer-web-service
  namespace: radhna-cuisine
spec:
  selector:
    app: customer-web
  ports:
    - port: 80
      targetPort: 3001
      name: http
  type: ClusterIP
