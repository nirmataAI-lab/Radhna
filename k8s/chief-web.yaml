apiVersion: apps/v1
kind: Deployment
metadata:
  name: chief-web
  namespace: radhna-cuisine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chief-web
  template:
    metadata:
      labels:
        app: chief-web
    spec:
      containers:
        - name: nginx
          image: radhna/chief-web:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chief-web-service
  namespace: radhna-cuisine
spec:
  selector:
    app: chief-web
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
