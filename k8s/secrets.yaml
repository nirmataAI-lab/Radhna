apiVersion: v1
kind: Secret
metadata:
  name: radhna-secrets
  namespace: radhna-cuisine
type: Opaque
stringData:
  # Generate with: kubectl create secret generic radhna-secrets --from-literal=DATABASE_URL=...
  DATABASE_URL: "postgresql://postgres:postgrespassword@postgres-service:5432/restaurant_db"
  JWT_SECRET: "replace-with-a-secure-random-string"

  # Email (SMTP)
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "your@email.com"
  SMTP_PASS: "your-password"
  EMAIL_FROM: "noreply@radhnacuisine.com"

  # SMS (Twilio)
  TWILIO_ACCOUNT_SID: "your-account-sid"
  TWILIO_AUTH_TOKEN: "your-auth-token"
  TWILIO_PHONE_NUMBER: "+1234567890"

  # Payments (Razorpay)
  RAZORPAY_KEY_ID: "your-key-id"
  RAZORPAY_KEY_SECRET: "your-key-secret"
  RAZORPAY_WEBHOOK_SECRET: "your-webhook-secret"
