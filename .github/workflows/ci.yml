name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Backend: TypeScript check + Unit tests ──────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: bun install
      - name: Generate Prisma client
        working-directory: database
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/restaurant_db
      - name: Typecheck
        working-directory: services/backend-api
        run: bunx tsc --noEmit --project tsconfig.json
      - name: Unit tests
        working-directory: services/backend-api
        run: bunx jest --no-coverage --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/restaurant_db
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

  # ─── Customer Web (Vite + React) ─────────────────────────
  customer-web:
    name: Customer Web (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Build (typechecks via tsc -b)
        working-directory: apps/customer-web
        run: bun run build

  # ─── Admin Web (Vite + React) ────────────────────────────
  admin-web:
    name: Admin Web (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Build (typechecks via tsc -b)
        working-directory: apps/admin-web
        run: bun run build

  # ─── Chief Web (Vite + React) ────────────────────────────
  chief-web:
    name: Chief Web (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Build (typechecks via tsc -b)
        working-directory: apps/chief-web
        run: bun run build

  # ─── E2E Tests (requires PostgreSQL) ─────────────────────
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: restaurant_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install
      - name: Generate Prisma client
        working-directory: database
        run: bunx prisma generate
      - name: Apply migrations
        working-directory: database
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/restaurant_db
      - name: E2E tests
        working-directory: services/backend-api
        run: bun run test:e2e --passWithNoTests
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/restaurant_db
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
